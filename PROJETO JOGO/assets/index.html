<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jokenpô</title>
</head>

<body>
    <div id="principal">
        <h1 id="titulo">Pedra, Papel, Tesoura</h1>

        <!-- PLACAR -->
        <div id="placar">
            <div id="jogador">
                <!-- Nome do jogador alterado pelo JS -->
                <h2 id="jogadorNome">Player</h2>
                <span id="jogadorPontos">0</span>
                <!-- Lista de escolhas -->
                <ul id="jogadorEscolha">
                    <li>
                        <!-- ID usado pelo JS para captura de clique -->
                        <a id="jogadorEscolha1">
                            <img src="./assets/pedra.png" alt="Pedra">
                        </a>
                    </li>
                    <li>
                        <!-- ID usado pelo JS para captura de clique -->
                        <a id="jogadorEscolha2">
                            <img src="./assets/papel.png" alt="Papel">
                        </a>
                    </li>
                    <li>
                        <!-- ID usado pelo JS para captura de clique -->
                        <a id="jogadorEscolha3">
                            <img src="./assets/tesoura.png" alt="Tesoura">
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Texto Central de "vs" -->
            <div id="versus">vs</div>

            <div id="computador">
                <!-- Nome do jogador alterado pelo JS -->
                <h2 id="computadorNome">Computador</h2>
                <span id="computadorPontos">0</span>
                <!-- Lista de escolhas -->
                <ul id="computadorEscolha">
                    <li>
                        <!-- ID usado pelo JS para captura de clique -->
                        <a id="computadorEscolha1">
                            <img src="./assets/pedra.png" alt="Pedra">
                        </a>
                    </li>
                    <li>
                        <!-- ID usado pelo JS para captura de clique -->
                        <a id="computadorEscolha2">
                            <img src="./assets/papel.png" alt="Papel">
                        </a>
                    </li>
                    <li>
                        <!-- ID usado pelo JS para captura de clique -->
                        <a id="computadorEscolha3">
                            <img src="./assets/tesoura.png" alt="Tesoura">
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <!-- mensagem atualiza dinamicamente -->
        <div id="mensagem">Mensagem</div>
    </div>
    </div>
</body>
<script src="script.js"></script>

</html>
